name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        run: |
          missing=0
          [ -z "${{ secrets.AWS_SSH_PRIVATE_KEY }}" ] && echo "::error::Missing AWS_SSH_PRIVATE_KEY" && missing=1
          [ -z "${{ secrets.AWS_HOST }}" ] && echo "::error::Missing AWS_HOST" && missing=1
          [ -z "${{ secrets.AWS_USER }}" ] && echo "::error::Missing AWS_USER" && missing=1
          [ -z "${{ secrets.GH_DEPLOY_TOKEN }}" ] && echo "::error::Missing GH_DEPLOY_TOKEN" && missing=1
          [ "$missing" -eq 1 ] && exit 1
          echo "Deploy secrets OK."

      - name: Validate SSH private key format
        run: |
          printf '%s\n' "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > deploy_key.pem
          chmod 600 deploy_key.pem
          ssh-keygen -y -f deploy_key.pem > /dev/null
          echo "SSH private key format is valid."

      - name: Test SSH port 22
        run: |
          host="${{ secrets.AWS_HOST }}"
          echo "Testing TCP ${host}:22 ..."
          for i in 1 2 3; do
            if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${host}/22" 2>/dev/null; then
              echo "Port 22 is reachable."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Cannot reach ${host}:22 — open port 22 in EC2 security group."
          exit 1

      - name: Verify GH_DEPLOY_TOKEN can read repository
        run: |
          git ls-remote "https://x-access-token:${{ secrets.GH_DEPLOY_TOKEN }}@github.com/${{ github.repository }}.git" HEAD
          echo "GH_DEPLOY_TOKEN can read repository."

      - name: Test SSH login to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          debug: true
          script_stop: true
          script: |
            echo "SSH OK — user=$(whoami) host=$(hostname)"
            echo "Home: $HOME"
            ls -la /home/ubuntu/ || true
            if [ -d /home/ubuntu/Zica-Zima-CRM ]; then
              echo "App directory exists."
              ls -la /home/ubuntu/Zica-Zima-CRM/.env 2>/dev/null || echo "WARNING: .env not found yet"
            else
              echo "App directory will be cloned on first deploy."
            fi

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          envs: GH_DEPLOY_TOKEN
          debug: true
          script_stop: true
          command_timeout: 30m
          script: |
            export GIT_TERMINAL_PROMPT=0
            test -n "${GH_DEPLOY_TOKEN:-}" || { echo "ERROR: GH_DEPLOY_TOKEN missing"; exit 1; }
            echo "GH_DEPLOY_TOKEN is set (length=${#GH_DEPLOY_TOKEN})."
            APP_DIR=/home/ubuntu/Zica-Zima-CRM
            REPO=https://github.com/${{ github.repository }}.git
            AUTH_REPO=https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/${{ github.repository }}.git
            test -d "$APP_DIR/.git" || { echo "=== Cloning repository ==="; rm -rf "$APP_DIR"; git clone --branch main "$AUTH_REPO" "$APP_DIR"; cd "$APP_DIR"; git remote set-url origin "$REPO"; }
            test -d "$APP_DIR/.git" && { echo "=== Updating repository ==="; cd "$APP_DIR"; git remote set-url origin "$AUTH_REPO"; git fetch origin main; git reset --hard origin/main; git remote set-url origin "$REPO"; }
            cd "$APP_DIR"
            echo "=== Commit on server: $(git rev-parse --short HEAD) ==="
            bash scripts/ci-deploy-remote.sh
