services:
  postgres:
    image: postgres:16-alpine
    container_name: zica-crm-postgres
    restart: unless-stopped
    ports:
      # Host 5433 avoids clash with any native Postgres already on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zica_crm_dev
    volumes:
      - zica_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zica_crm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  zica_crm_pgdata:
